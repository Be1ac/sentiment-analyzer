<!--
User Interface for Data Scraper
--> 

<!DOCTYPE html>
<html>
<head>
    <title>Sentiment Analyzer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Live News Sentiment Analysis</h2>
    <form method="POST">
        <div class="input-group mb-3">
            <input type="text" name="topic" class="form-control" placeholder="Enter topic (e.g. Bitcoin, Apple, NASA)">
            <button class="btn btn-primary" type="submit">Analyze</button>
        </div>
    </form>

    {% if results %}
    <table class="table mt-4">
        <thead>
            <tr><th>Headline</th><th>Polarity</th><th>Sentiment</th></tr>
        </thead>
        <tbody>
            {% for item in results %}
            <tr>
                <td>{{ item.text }}</td>
                <td>{{ item.score }}</td>
                <td>
                    {% if item.score > 0 %} <span class="badge bg-success">Positive</span>
                    {% elif item.score < 0 %} <span class="badge bg-danger">Negative</span>
                    {% else %} <span class="badge bg-secondary">Neutral</span>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% endif %}
</body>
</html>
